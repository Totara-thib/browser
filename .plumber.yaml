# Plumber configuration for this repository: only the differences from
# the built-in default configuration. Every control runs with its default
# settings, including controls added in later releases.
# Reference: https://github.com/getplumber/plumber
extends: plumber:default
version: '2.0'

github:
  controls:
    githubActionMustComeFromAuthorizedSources:
      includePlumberDefaults: true
      trustedGithubActions:
        # CLA check on pull requests (cla.yml).
        - contributor-assistant/github-action
        # Publishes the release and nightly assets (release.yml, package-debian.yml).
        - ncipollo/release-action
        # Installs Zig for the format check (zig-test.yml).
        - mlugg/setup-zig
